services:
  db:
    image: postgres:16-alpine
    container_name: fairshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fairshare}
    ports:
      - "5432:5432"
    volumes:
      - fairshare-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fairshare}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fairshare-db-data: